services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: listings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listings"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  db-init:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/listings
    command:
      - python
      - scripts/init_db.py
      - --database-url
      - postgresql://postgres:postgres@db:5432/listings
      - --schema
      - schema.sql
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  data-loader:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/listings
    command:
      - python
      - scripts/load_data.py
      - --database-url
      - postgresql://postgres:postgres@db:5432/listings
      - --listings
      - /data/listings.csv
      - --areas
      - /data/helsinki_areas.geojson
    volumes:
      - ./data:/data:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/listings
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      data-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  docs:
    image: nginx:1.27-alpine
    ports:
      - "3001:80"
    volumes:
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
